<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Infrastructure Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans"
    x-data="statusDashboard()">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
                <h1 class="text-xl font-black tracking-wider text-slate-100">INFRA<span
                        class="text-indigo-500">OPS</span> // WEBSOCKET STREAM</h1>
            </div>
            <div class="flex items-center space-x-3 text-sm text-slate-400">
                <button @click="showAddModal = true"
                    class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold transition">
                    + Add Node
                </button>
                <a href="http://localhost:5000/api/export" target="_blank"
                    class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold transition">
                    Export Logs
                </a>
                <button @click="triggerAudit()"
                    class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition shadow-md">
                    Run Diagnostics
                </button>
                <span class="hidden md:inline">Synced: <span x-text="lastUpdated"
                        class="text-emerald-400 font-mono font-bold"></span></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8 w-full flex-grow space-y-6">

        <!-- Status Banner -->
        <div class="p-5 rounded-2xl border flex items-center justify-between shadow-lg backdrop-blur-md"
            :class="allOperational ? 'bg-emerald-950/20 border-emerald-800/60 text-emerald-300' : 'bg-amber-950/20 border-amber-800/60 text-amber-300'">
            <div class="flex items-center space-x-4">
                <div class="p-2 rounded-xl bg-slate-900/80 border border-slate-700">
                    <svg x-show="allOperational" class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg"
                        x-text="allOperational ? 'Cluster Health: Optimal & Fully Operational' : 'Cluster Warning: Degraded Nodes Detected'">
                    </h2>
                    <p class="text-xs text-slate-400">WebSocket persistent bi-directional stream active.</p>
                </div>
            </div>
            <span class="text-xs px-3.5 py-1.5 bg-slate-900 rounded-xl border border-slate-800 font-mono"
                x-text="totalServers + ' Active Nodes'"></span>
        </div>

        <!-- Server Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <template x-for="server in servers" :key="server.id">
                <div
                    class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-lg text-slate-100" x-text="server.name"></h3>
                                <span class="text-xs text-slate-500 font-mono" x-text="'ID: ' + server.id"></span>
                            </div>
                            <span
                                class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider font-mono shadow-inner"
                                :class="server.status === 'online' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'"
                                x-text="server.status">
                            </span>
                        </div>

                        <!-- Current Telemetry Gauges -->
                        <div class="grid grid-cols-2 gap-4 my-4">
                            <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                                <span class="text-xs text-slate-400 block mb-1">CPU Load</span>
                                <span class="text-xl font-mono font-bold text-indigo-400"
                                    x-text="server.cpuUsage"></span>
                            </div>
                            <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                                <span class="text-xs text-slate-400 block mb-1">Memory Usage</span>
                                <span class="text-xl font-mono font-bold text-sky-400"
                                    x-text="server.memoryUsage"></span>
                            </div>
                        </div>

                        <!-- Multi-Metric Chart Component for Local Node -->
                        <div class="mt-4 p-3 bg-slate-950/50 rounded-xl border border-slate-800"
                            x-show="server.id === 'srv-local'">
                            <div class="flex justify-between items-center mb-2">
                                <div class="space-x-1">
                                    <button @click="switchMetric('cpu')"
                                        class="px-2 py-0.5 text-[10px] rounded font-mono transition"
                                        :class="activeMetric === 'cpu' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'">CPU
                                        %</button>
                                    <button @click="switchMetric('memory')"
                                        class="px-2 py-0.5 text-[10px] rounded font-mono transition"
                                        :class="activeMetric === 'memory' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-400'">Memory
                                        %</button>
                                    <button @click="switchMetric('latency')"
                                        class="px-2 py-0.5 text-[10px] rounded font-mono transition"
                                        :class="activeMetric === 'latency' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'">Latency
                                        (ms)</button>
                                </div>
                                <span
                                    class="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded font-mono animate-pulse">WS
                                    Live</span>
                            </div>
                            <div style="height: 120px; position: relative; width: 100%;">
                                <canvas id="metricsChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Footer Info -->
                    <div
                        class="mt-6 pt-4 border-t border-slate-800 flex justify-between text-xs text-slate-400 font-mono">
                        <div>Uptime: <span class="text-slate-200 font-bold" x-text="server.uptime"></span></div>
                        <div>Latency: <span class="text-slate-200 font-bold" x-text="server.latency"></span></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Incident Activity Log Section -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h3 class="font-bold text-md text-slate-200 mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
                System Event & Incident Stream
            </h3>
            <div class="space-y-2 font-mono text-xs">
                <template x-for="incident in incidents">
                    <div
                        class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 flex justify-between items-center">
                        <span class="text-slate-300" x-text="incident.message"></span>
                        <span class="text-slate-500" x-text="new Date(incident.timestamp).toLocaleTimeString()"></span>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Add Node Modal -->
    <div x-show="showAddModal"
        class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-100">Register New Monitored Node</h3>
            <p class="text-xs text-slate-400">Add an external server IP or domain name for live WebSocket tracking.</p>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Node Name</label>
                    <input type="text" x-model="newNodeName" placeholder="e.g. EU Database Gateway"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Host IP / Domain</label>
                    <input type="text" x-model="newNodeHost" placeholder="e.g. 8.8.4.4 or api.example.com"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button @click="showAddModal = false"
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                <button @click="addNode()"
                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">Add
                    Node</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500 font-mono">
        <p>InfraOps Enterprise Engine &bull; WebSocket Telemetry Stream</p>
    </footer>

    <!-- Script Logic -->
    <script>
        let chartInstance = null;
        const socket = io('http://localhost:5000');

        function statusDashboard() {
            return {
                servers: [],
                totalServers: 0,
                lastUpdated: 'Connecting...',
                allOperational: true,
                incidents: [],
                showAddModal: false,
                newNodeName: '',
                newNodeHost: '',
                activeMetric: 'cpu',
                latestHistory: [],

                init() {
                    this.$nextTick(() => this.initChart());

                    socket.on('connect', () => {
                        socket.emit('request-telemetry');
                    });

                    socket.on('telemetry-update', (data) => {
                        this.servers = data.servers;
                        this.totalServers = data.totalServers;
                        this.lastUpdated = new Date(data.timestamp).toLocaleTimeString();
                        this.allOperational = this.servers.every(s => s.status === 'online');
                        this.incidents = data.incidents || [];

                        const localServer = this.servers.find(s => s.id === 'srv-local');
                        if (localServer && localServer.history) {
                            this.latestHistory = localServer.history;
                            this.updateChartData();
                        }
                    });
                },

                initChart() {
                    const ctx = document.getElementById('metricsChart');
                    if (ctx && !chartInstance) {
                        chartInstance = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: [],
                                datasets: [{
                                    label: 'CPU Usage %',
                                    data: [],
                                    borderColor: '#818cf8',
                                    backgroundColor: 'rgba(129, 140, 248, 0.1)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.35,
                                    pointRadius: 2
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { display: false },
                                    y: {
                                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                        ticks: { color: '#64748b', font: { size: 9 } }
                                    }
                                }
                            }
                        });
                    }
                },

                switchMetric(metricType) {
                    this.activeMetric = metricType;
                    if (chartInstance) {
                        if (metricType === 'cpu') {
                            chartInstance.data.datasets[0].label = 'CPU Usage %';
                            chartInstance.data.datasets[0].borderColor = '#818cf8';
                            chartInstance.data.datasets[0].backgroundColor = 'rgba(129, 140, 248, 0.1)';
                        } else if (metricType === 'memory') {
                            chartInstance.data.datasets[0].label = 'Memory Usage %';
                            chartInstance.data.datasets[0].borderColor = '#38bdf8';
                            chartInstance.data.datasets[0].backgroundColor = 'rgba(56, 189, 248, 0.1)';
                        } else if (metricType === 'latency') {
                            chartInstance.data.datasets[0].label = 'Latency (ms)';
                            chartInstance.data.datasets[0].borderColor = '#34d399';
                            chartInstance.data.datasets[0].backgroundColor = 'rgba(52, 211, 153, 0.1)';
                        }
                    }
                    this.updateChartData();
                },

                updateChartData() {
                    if (!chartInstance || !this.latestHistory.length) return;
                    chartInstance.data.labels = this.latestHistory.map(h => new Date(h.timestamp).toLocaleTimeString());

                    if (this.activeMetric === 'cpu') {
                        chartInstance.data.datasets[0].data = this.latestHistory.map(h => h.cpu_usage);
                    } else if (this.activeMetric === 'memory') {
                        chartInstance.data.datasets[0].data = this.latestHistory.map(h => h.memory_usage);
                    } else if (this.activeMetric === 'latency') {
                        chartInstance.data.datasets[0].data = this.latestHistory.map(h => h.latency);
                    }
                    chartInstance.update('none');
                },

                addNode() {
                    if (!this.newNodeName || !this.newNodeHost) return;
                    fetch('http://localhost:5000/api/nodes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: this.newNodeName, host: this.newNodeHost })
                    })
                        .then(res => res.json())
                        .then(() => {
                            this.newNodeName = '';
                            this.newNodeHost = '';
                            this.showAddModal = false;
                            socket.emit('request-telemetry');
                        });
                },

                triggerAudit() {
                    fetch('http://localhost:5000/api/audit', { method: 'POST' })
                        .then(res => res.json())
                        .then(() => socket.emit('request-telemetry'));
                }
            }
        }
    </script>
</body>

</html>
